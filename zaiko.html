<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>機材管理シート</title>
    <style>
        body { font-family: sans-serif; margin: 0; background-color: #fff; color: #000; }
        
        /* テーブルのレイアウトを固定 */
        table { 
            border-collapse: collapse; 
            width: 100%; 
            table-layout: fixed; /* これで列幅を厳密に固定 */
        }
        
        /* 1行目（ヘッダー） */
        thead th {
            position: sticky; top: 0; z-index: 10;
            background-color: #000; color: #fff;
            font-size: 13px; 
            padding: 15px 0;
            border: none;
        }

        /* 各列の幅を％で厳密に指定 */
        .w-name   { width: 35%; } 
        .w-remain { width: 13%; } 
        .w-shoot  { width: 10.4%; } 

        td { 
            padding: 0; /* 余白をゼロにしてズレを防止 */
            text-align: center; 
            vertical-align: middle;
            border-bottom: 1px solid #eee;
        }

        /* 機材名：フォントを小さく、2行目以降の視認性向上 */
        .col-name { 
            font-size: 14px; /* 1行目より小さく設定 */
            font-weight: bold;
            color: #333;
            text-align: left !important;
            padding-left: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 残り数量 */
        .col-remain { 
            font-size: 20px; 
            font-weight: 900; 
            color: #d32f2f;
            background-color: #fffafa;
        }

        /* 入力エリア：縦ラインを意識したデザイン */
        input[type="number"] {
            width: 100%; /* セルいっぱいに広げる */
            height: 55px; /* 高さを出してタップしやすく */
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            border: none;
            background-color: transparent;
            /* 左右に薄い縦線を入れて、縦の並びを強調 */
            border-left: 1px solid #f0f0f0;
            border-right: 1px solid #f0f0f0;
            outline: none;
            border-radius: 0;
            -moz-appearance: textfield;
        }

        /* 入力箇所の背景を1列おきに薄く色付け（縦の視認性向上） */
        td:nth-child(odd) input { background-color: #f9f9f9; }
        input:focus { background-color: #e8f0fe !important; }

        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button {
            -webkit-appearance: none; margin: 0;
        }

        /* 行の区切りを強調 */
        tr { border-bottom: 1px solid #ddd; }
    </style>
</head>
<body>

<table>
    <thead>
        <tr>
            <th class="w-name">機材名</th>
            <th class="w-remain">残</th>
            <th class="w-shoot">①</th>
            <th class="w-shoot">②</th>
            <th class="w-shoot">③</th>
            <th class="w-shoot">④</th>
            <th class="w-shoot">⑤</th>
        </tr>
    </thead>
    <tbody id="tableBody">
        </tbody>
</table>

<script>
const masterData = [
    { name: "Sony α7IV", stock: 10 },
    { name: "Sony α7sIII", stock: 5 },
    { name: "FE 24-70mm GM II", stock: 8 },
    { name: "FE 70-200mm GM", stock: 4 },
    { name: "Sachtler Flowtech", stock: 12 },
    { name: "Aputure 600d Pro", stock: 6 },
    { name: "Sony UWP-D21", stock: 10 }
];

const tableBody = document.getElementById('tableBody');

masterData.forEach((item, index) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
        <td class="col-name">${item.name}</td>
        <td class="col-remain" id="remain-${index}">${item.stock}</td>
        <td><input type="number" value="0" oninput="calculate(${index}, ${item.stock})" onclick="this.select()"></td>
        <td><input type="number" value="0" oninput="calculate(${index}, ${item.stock})" onclick="this.select()"></td>
        <td><input type="number" value="0" oninput="calculate(${index}, ${item.stock})" onclick="this.select()"></td>
        <td><input type="number" value="0" oninput="calculate(${index}, ${item.stock})" onclick="this.select()"></td>
        <td><input type="number" value="0" oninput="calculate(${index}, ${item.stock})" onclick="this.select()"></td>
    `;
    tableBody.appendChild(tr);
});

function calculate(rowIndex, stock) {
    const row = document.querySelectorAll('#tableBody tr')[rowIndex];
    const inputs = row.querySelectorAll('input[type="number"]');
    const remainCell = document.getElementById(`remain-${rowIndex}`);

    let totalUsed = 0;
    inputs.forEach(input => {
        totalUsed += parseInt(input.value) || 0;
    });

    const currentRemain = stock - totalUsed;
    remainCell.innerText = currentRemain;

    if (currentRemain < 0) {
        remainCell.style.backgroundColor = "#ffcccc"; 
        remainCell.style.color = "#ff0000";
    } else {
        remainCell.style.backgroundColor = "#fffafa";
        remainCell.style.color = "#d32f2f";
    }
}
</script>

</body>
</html>
