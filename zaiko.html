<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>機材管理</title>
    <style>
        /* 画面全体のスクロールとふらつきを禁止 */
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; /* 本体はスクロールさせない */
            position: fixed; /* 全体を画面に固定 */
        }

        /* テーブル専用のスクロールコンテナ */
        .scroll-container {
            width: 100%;
            height: 100vh;
            overflow-y: auto; /* 縦スクロールのみ許可 */
            overflow-x: hidden; /* 横揺れを完全防止 */
            -webkit-overflow-scrolling: touch;
        }
        
        table { 
            border-collapse: collapse; 
            width: 100%; 
            table-layout: fixed;
        }
        
        /* ヘッダー固定：z-indexを最強にして入力時も残す */
        thead th {
            position: sticky; 
            top: 0; 
            z-index: 100;
            background-color: #000; 
            color: #fff;
            padding: 10px 0; 
            height: 120px;
            vertical-align: middle;
            border: none;
        }

        .v-text-box {
            display: inline-block;
            font-size: 14px;
            line-height: 1.2;
            width: 1em;
            word-wrap: break-word;
            font-weight: bold;
        }

        .reset-btn {
            display: block;
            margin: 8px auto 0;
            padding: 5px 0;
            width: 85%;
            font-size: 11px;
            background: #e74c3c;
            color: #fff;
            border: none;
            border-radius: 4px;
        }

        /* 列幅を％で厳密に固定（合計100%） */
        .w-name   { width: 34%; } 
        .w-remain { width: 12%; } 
        .w-shoot  { width: 10.8%; } 

        td { padding: 0; text-align: center; vertical-align: middle; border-bottom: 1px solid #ddd; }

        .col-name { 
            font-size: 10px; font-weight: bold; color: #333;
            text-align: left !important; padding-left: 6px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .col-remain { font-size: 18px; font-weight: 900; color: #d32f2f; background-color: #fffafa; }

        /* 入力エリア */
        input[type="number"] {
            width: 100%; height: 60px;
            font-size: 22px; font-weight: bold;
            text-align: center; border: none; background-color: transparent;
            outline: none; display: block;
            border-radius: 0;
            -webkit-appearance: none;
        }

        .bg-guide { background-color: #f7f7f7; }
        /* フォーカス時に背景を変えるが、画面位置は維持 */
        input:focus { background-color: #e8f0fe !important; }
    </style>
</head>
<body>

<div class="scroll-container">
    <table>
        <thead>
            <tr>
                <th class="w-name">機材名</th>
                <th class="w-remain">残</th>
                <th class="w-shoot"><span class="v-text-box">撮影１</span><button class="reset-btn" onclick="resetColumn(0)">消</button></th>
                <th class="w-shoot"><span class="v-text-box">撮影２</span><button class="reset-btn" onclick="resetColumn(1)">消</button></th>
                <th class="w-shoot"><span class="v-text-box">撮影３</span><button class="reset-btn" onclick="resetColumn(2)">消</button></th>
                <th class="w-shoot"><span class="v-text-box">撮影４</span><button class="reset-btn" onclick="resetColumn(3)">消</button></th>
                <th class="w-shoot"><span class="v-text-box">撮影５</span><button class="reset-btn" onclick="resetColumn(4)">消</button></th>
            </tr>
        </thead>
        <tbody id="tableBody">
            </tbody>
    </table>
</div>

<script>
const masterData = [
    { name: "HMI", stock: 0 },
    { name: "Sony α7IV", stock: 10 },
    { name: "Sony α7sIII", stock: 5 },
    { name: "FE 24-70mm GM II", stock: 8 },
    { name: "FE 70-200mm GM", stock: 4 },
    { name: "Sachtler Flowtech", stock: 12 },
    { name: "600d Pro", stock: 6 },
    { name: "UWP-D21", stock: 10 },
    { name: "追加機材 A", stock: 5 },
    { name: "追加機材 B", stock: 3 },
    { name: "追加機材 C", stock: 8 }
];

const tableBody = document.getElementById('tableBody');

masterData.forEach((item, index) => {
    const tr = document.createElement('tr');
    tr.dataset.stock = item.stock;
    tr.innerHTML = `
        <td class="col-name">${item.name}</td>
        <td class="col-remain" id="remain-${index}">${item.stock}</td>
        <td class="bg-guide"><input type="number" class="shoot-0" value="0" oninput="calculateRow(${index})" onclick="this.select()"></td>
        <td><input type="number" class="shoot-1" value="0" oninput="calculateRow(${index})" onclick="this.select()"></td>
        <td class="bg-guide"><input type="number" class="shoot-2" value="0" oninput="calculateRow(${index})" onclick="this.select()"></td>
        <td><input type="number" class="shoot-3" value="0" oninput="calculateRow(${index})" onclick="this.select()"></td>
        <td class="bg-guide"><input type="number" class="shoot-4" value="0" oninput="calculateRow(${index})" onclick="this.select()"></td>
    `;
    tableBody.appendChild(tr);
});

function calculateRow(rowIndex) {
    const row = document.querySelectorAll('#tableBody tr')[rowIndex];
    const inputs = row.querySelectorAll('input[type="number"]');
    const stock = parseInt(row.dataset.stock);
    const remainCell = document.getElementById(`remain-${rowIndex}`);

    let totalUsed = 0;
    inputs.forEach(input => {
        totalUsed += parseInt(input.value) || 0;
    });

    const currentRemain = stock - totalUsed;
    remainCell.innerText = currentRemain;

    if (currentRemain < 0) {
        remainCell.style.backgroundColor = "#ff0000"; 
        remainCell.style.color = "#ffffff";
    } else {
        remainCell.style.backgroundColor = "#fffafa";
        remainCell.style.color = "#d32f2f";
    }
}

function resetColumn(colIndex) {
    if(!confirm(`撮影${colIndex + 1}をリセット？`)) return;
    const inputs = document.querySelectorAll(`.shoot-${colIndex}`);
    inputs.forEach((input, rowIndex) => {
        input.value = 0;
        calculateRow(rowIndex);
    });
}
</script>

</body>
</html>
