<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>機材管理</title>
    <style>
        body { font-family: sans-serif; margin: 0; background-color: #fff; }
        
        table { 
            border-collapse: collapse; 
            width: 100%; 
            table-layout: fixed; /* 列幅を厳密に固定 */
        }
        
        /* ヘッダー */
        thead th {
            position: sticky; top: 0; z-index: 10;
            background-color: #000; color: #fff;
            font-size: 13px; padding: 12px 0;
            border: none;
        }

        /* 7列の幅を合計100%に固定 */
        .w-name   { width: 34%; } 
        .w-remain { width: 11%; } 
        .w-shoot  { width: 11%; } 

        td { 
            padding: 0; 
            text-align: center; 
            vertical-align: middle;
            border-bottom: 1px solid #ddd;
        }

        /* 機材名：2行目以降フォント小 */
        .col-name { 
            font-size: 11px; 
            font-weight: bold;
            color: #333;
            text-align: left !important;
            padding-left: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 残り数量 */
        .col-remain { 
            font-size: 18px; 
            font-weight: 900; 
            color: #d32f2f;
            background-color: #fffafa;
        }

        /* 入力エリア：縦ライン強調・余計な枠なし */
        input[type="number"] {
            width: 100%;
            height: 50px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            border: none;
            background-color: transparent;
            outline: none;
            display: block;
            -moz-appearance: textfield;
        }

        /* 縦のガイドライン：1列おきに薄いグレー */
        .bg-guide { background-color: #f7f7f7; }
        
        input:focus { background-color: #e8f0fe !important; }

        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button {
            -webkit-appearance: none; margin: 0;
        }
    </style>
</head>
<body>

<table>
    <thead>
        <tr>
            <th class="w-name">機材名</th>
            <th class="w-remain">残</th>
            <th class="w-shoot">①</th>
            <th class="w-shoot">②</th>
            <th class="w-shoot">③</th>
            <th class="w-shoot">④</th>
            <th class="w-shoot">⑤</th>
        </tr>
    </thead>
    <tbody id="tableBody">
        </tbody>
</table>

<script>
const masterData = [
    { name: "Sony α7IV", stock: 10 },
    { name: "Sony α7sIII", stock: 5 },
    { name: "FE 24-70mm GM II", stock: 8 },
    { name: "FE 70-200mm GM", stock: 4 },
    { name: "Sachtler Flowtech", stock: 12 },
    { name: "600d Pro", stock: 6 },
    { name: "UWP-D21", stock: 10 }
];

const tableBody = document.getElementById('tableBody');

masterData.forEach((item, index) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
        <td class="col-name">${item.name}</td>
        <td class="col-remain" id="remain-${index}">${item.stock}</td>
        <td class="bg-guide"><input type="number" value="0" oninput="calculate(${index}, ${item.stock})" onclick="this.select()"></td>
        <td><input type="number" value="0" oninput="calculate(${index}, ${item.stock})" onclick="this.select()"></td>
        <td class="bg-guide"><input type="number" value="0" oninput="calculate(${index}, ${item.stock})" onclick="this.select()"></td>
        <td><input type="number" value="0" oninput="calculate(${index}, ${item.stock})" onclick="this.select()"></td>
        <td class="bg-guide"><input type="number" value="0" oninput="calculate(${index}, ${item.stock})" onclick="this.select()"></td>
    `;
    tableBody.appendChild(tr);
});

function calculate(rowIndex, stock) {
    const row = document.querySelectorAll('#tableBody tr')[rowIndex];
    const inputs = row.querySelectorAll('input[type="number"]');
    const remainCell = document.getElementById(`remain-${rowIndex}`);

    let totalUsed = 0;
    inputs.forEach(input => {
        totalUsed += parseInt(input.value) || 0;
    });

    const currentRemain = stock - totalUsed;
    remainCell.innerText = currentRemain;

    if (currentRemain < 0) {
        remainCell.style.backgroundColor = "#ff0000"; 
        remainCell.style.color = "#ffffff";
    } else {
        remainCell.style.backgroundColor = "#fffafa";
        remainCell.style.color = "#d32f2f";
    }
}
</script>

</body>
</html>
