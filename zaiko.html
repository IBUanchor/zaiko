<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>機材在庫管理シート</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f4f7f6; }
        .table-container { overflow-x: auto; max-width: 100%; border: 1px solid #ccc; }
        
        table { border-collapse: collapse; width: 100%; background: white; min-width: 800px; }
        
        /* ヘッダー固定 */
        th {
            position: sticky;
            top: 0;
            background-color: #2c3e50;
            color: white;
            z-index: 10;
            padding: 12px;
            white-space: nowrap;
        }

        /* 1〜3列目と最終列（在庫）を横スクロール時に固定 */
        .sticky-col {
            position: sticky;
            z-index: 5;
            background-color: #f9f9f9;
        }
        .col-type { left: 0; }
        .col-name { left: 80px; } /* 前の列の幅に合わせて調整 */
        .col-remain { left: 200px; font-weight: bold; color: #e74c3c; }

        td { border: 1px solid #ddd; padding: 10px; text-align: center; }

        /* 入力エリアのスタイル */
        input[type="number"] {
            width: 60px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            text-align: center;
            font-size: 16px; /* モバイルでズームしないように */
        }

        tr:hover { background-color: #f1f1f1; }
        .bg-gray { background-color: #eee; }
    </style>
</head>
<body>

<h2>機材在庫管理システム</h2>

<div class="table-container">
    <table id="equipmentTable">
        <thead>
            <tr>
                <th class="sticky-col col-type">機材種類</th>
                <th class="sticky-col col-name">機材名</th>
                <th class="sticky-col col-remain">残り数量</th>
                <th>撮影1</th>
                <th>撮影2</th>
                <th>撮影3</th>
                <th>撮影4</th>
                <th>撮影5</th>
                <th>在庫数</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            </tbody>
    </table>
</div>

<script>
// 別データ（本来はデータベースやAPIから取得する想定）
const masterData = [
    { type: "カメラ", name: "Sony α7IV", stock: 10 },
    { type: "レンズ", name: "24-70mm GM", stock: 5 },
    { type: "照明", name: "Aputure 300d", stock: 8 },
    { type: "三脚", name: "Manfrotto", stock: 12 }
];

const tableBody = document.getElementById('tableBody');

// テーブル行の生成
masterData.forEach((item, index) => {
    const tr = document.createElement('tr');
    
    tr.innerHTML = `
        <td class="sticky-col col-type">${item.type}</td>
        <td class="sticky-col col-name">${item.name}</td>
        <td class="sticky-col col-remain" id="remain-${index}">${item.stock}</td>
        <td><input type="number" value="0" min="0" oninput="calculate(${index})" onclick="this.select()"></td>
        <td><input type="number" value="0" min="0" oninput="calculate(${index})" onclick="this.select()"></td>
        <td><input type="number" value="0" min="0" oninput="calculate(${index})" onclick="this.select()"></td>
        <td><input type="number" value="0" min="0" oninput="calculate(${index})" onclick="this.select()"></td>
        <td><input type="number" value="0" min="0" oninput="calculate(${index})" onclick="this.select()"></td>
        <td class="bg-gray" id="stock-${index}">${item.stock}</td>
    `;
    tableBody.appendChild(tr);
});

// 計算ロジック
function calculate(rowIndex) {
    const row = document.querySelectorAll('#tableBody tr')[rowIndex];
    const inputs = row.querySelectorAll('input[type="number"]');
    const stock = parseInt(document.getElementById(`stock-${rowIndex}`).innerText);
    const remainCell = document.getElementById(`remain-${rowIndex}`);

    let totalUsed = 0;
    inputs.forEach(input => {
        totalUsed += parseInt(input.value) || 0;
    });

    const currentRemain = stock - totalUsed;
    remainCell.innerText = currentRemain;

    // 残り数がマイナスになったら色を変える演出
    remainCell.style.color = currentRemain < 0 ? "red" : "#e74c3c";
}
</script>

</body>
</html>
