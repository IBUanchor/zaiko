<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>機材管理</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
        }

        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow-x: hidden; background-color: #fff; }

        table { border-collapse: collapse; width: 100%; table-layout: fixed; }

        thead th {
            position: sticky; top: 0; z-index: 100;
            background-color: #000; color: #fff;
            height: 120px; padding: 0; vertical-align: middle; border: none;
        }

        .v-text-box { display: inline-block; font-size: 14px; line-height: 1.1; width: 1em; font-weight: bold; }

        .reset-btn {
            display: block; margin: 8px auto 0; padding: 5px 0; width: 85%;
            font-size: 11px; background: #e74c3c; color: #fff;
            border: none; border-radius: 4px; font-weight: bold;
        }

        .w-name   { width: 34%; }
        .w-remain { width: 12%; }
        .w-shoot  { width: 10.8%; }

        td { padding: 0; text-align: center; vertical-align: middle; border-bottom: 1px solid #ddd; }

        .col-name {
            font-size: 10px; font-weight: bold; color: #000;
            text-align: left !important; padding-left: 6px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .col-remain { font-size: 18px; font-weight: 900; color: #d32f2f; background-color: #fffafa; }

        input[type="number"] {
            width: 100%; height: 60px; font-size: 18px; font-weight: bold;
            text-align: center; border: none; background-color: transparent;
            outline: none; display: block; -webkit-appearance: none; color: #000;
        }

        .bg-guide { background-color: rgba(0,0,0,0.03); }
        input:focus { background-color: #e8f0fe !important; }
        .is-zero { color: #ccc !important; }
        /* ヘッダーの入力枠のスタイル */
        .header-input {
            width: 35px;            /* 縦書きに見えるように幅を制限 */
            height:80px;
            background: #333;
            color: #fff;
            border: 1px solid #777; /* 入力できることがわかるよう薄く枠線 */
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            outline: none;
            padding: 2px 0;
            border-radius: 4px;
            /* 確実に縦書きにする設定 */
            writing-mode: vertical-rl; 
            text-orientation: upright;
            display: block;
            margin: 0 auto;
        }
        .header-input:focus {
            background: #444;       /* タップした時に少し明るく */
            border-color: #ffff;
}
    </style>
</head>

// ジャンル名ごとに色を保持するオブジェクト
const genreColors = {};
// 背景色として使うパステルカラーのリスト
const palette = [
    "#e3f2fd", "#f1f8e9", "#fff3e0", "#f3e5f5", "#e0f2f1", 
    "#fff9c4", "#ffecb3", "#d1c4e9", "#c8e6c9", "#b3e5fc"
];
let colorIndex = 0;

const tableBody = document.getElementById('tableBody');

masterData.forEach((item, index) => {
    const tr = document.createElement('tr');
    tr.dataset.stock = item.stock;

    // 未登録のジャンルなら新しい色を割り当て
    if (!genreColors[item.genre]) {
        genreColors[item.genre] = palette[colorIndex % palette.length];
        colorIndex++;
    }

    tr.innerHTML = `
        <td class="col-name" style="background-color: ${genreColors[item.genre]}">${item.name}</td>
        <td class="col-remain" id="remain-${index}">${item.stock}</td>
        <td class="bg-guide"><input type="number" class="shoot-0"　is-zero value="0" oninput="calculateRow(${index})" onclick="this.select()"></td>
        <td><input type="number" class="shoot-1" is-zero value="0" oninput="calculateRow(${index})" onclick="this.select()"></td>
        <td class="bg-guide"><input type="number" class="shoot-2" is-zero value="0" oninput="calculateRow(${index})" onclick="this.select()"></td>
        <td><input type="number" class="shoot-3" is-zero value="0" oninput="calculateRow(${index})" onclick="this.select()"></td>
        <td class="bg-guide"><input type="number" class="shoot-4" is-zero value="0" oninput="calculateRow(${index})" onclick="this.select()"></td>
    `;
    tableBody.appendChild(tr);
});

function calculateRow(rowIndex) {
    const row = document.querySelectorAll('#tableBody tr')[rowIndex];
    const inputs = row.querySelectorAll('input[type="number"]');
    inputs.forEach(input => {
        if (parseInt(input.value) > 0) {
            input.classList.remove('is-zero');
        } else {
            input.classList.add('is-zero');
        }
    });
    const stock = parseInt(row.dataset.stock);
    const remainCell = document.getElementById(`remain-${rowIndex}`);
    let totalUsed = 0;
    inputs.forEach(input => { totalUsed += parseInt(input.value) || 0; });
    const currentRemain = stock - totalUsed;
    remainCell.innerText = currentRemain;
    if (currentRemain < 0) {
        remainCell.style.backgroundColor = "#ff0000"; remainCell.style.color = "#ffffff";
    } else {
        remainCell.style.backgroundColor = "#fffafa"; remainCell.style.color = "#d32f2f";
    }
}

function resetColumn(colIndex) {
    const colName = document.querySelectorAll('.header-input')[colIndex].value;
    if(!confirm(`撮影${colIndex + 1}をリセット？`)) return;
    const inputs = document.querySelectorAll(`.shoot-${colIndex}`);
    inputs.forEach((input, rowIndex) => {
        input.value = 0;
        calculateRow(rowIndex);
    });
}
