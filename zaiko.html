<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>機材入力</title>
    <style>
        body { font-family: sans-serif; margin: 0; background-color: #fff; color: #000; }
        
        table { 
            border-collapse: collapse; 
            width: 100%; 
            table-layout: fixed; 
        }
        
        /* ヘッダー固定 */
        thead th {
            position: sticky; top: 0; z-index: 10;
            background-color: #000; color: #fff;
            font-size: 16px; padding: 10px 2px;
            border: 1px solid #333;
        }

        td { border: 1px solid #ccc; padding: 6px 2px; text-align: center; vertical-align: middle; }

        /* 機材名：大きく黒く */
        .col-name { 
            color: #000; font-weight: bold; font-size: 18px; 
            text-align: left !important; padding-left: 8px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        /* 残り数量：最大強調 */
        .col-remain { font-size: 24px; font-weight: 900; color: #d32f2f; }

        /* 入力エリア：さらに大きく */
        input[type="number"] {
            width: 95%;
            height: 48px; /* さらに高くしてタップミス防止 */
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            border: 2px solid #bbb;
            border-radius: 4px;
            -moz-appearance: textfield;
        }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button {
            -webkit-appearance: none; margin: 0;
        }

        /* 列の幅調整（合計100%） */
        .w-name   { width: 35%; } /* 機材名（広く確保） */
        .w-remain { width: 15%; } /* 残 */
        .w-shoot  { width: 10%; } /* 撮影1〜5 */

        tr:nth-child(even) { background-color: #f2f2f2; } /* 行を交互に色付け */
    </style>
</head>
<body>

<table>
    <thead>
        <tr>
            <th class="w-name">機材名</th>
            <th class="w-remain">残</th>
            <th class="w-shoot">①</th>
            <th class="w-shoot">②</th>
            <th class="w-shoot">③</th>
            <th class="w-shoot">④</th>
            <th class="w-shoot">⑤</th>
        </tr>
    </thead>
    <tbody id="tableBody">
        </tbody>
</table>

<script>
// データ（在庫数は計算用に内部で保持）
const masterData = [
    { name: "Sony α7IV", stock: 10 },
    { name: "Sony α7sIII", stock: 5 },
    { name: "24-70mm GM", stock: 8 },
    { name: "70-200mm GM", stock: 4 },
    { name: "Sachtler 三脚", stock: 12 },
    { name: "600d Pro", stock: 6 },
    { name: "UWP-D21", stock: 10 }
];

const tableBody = document.getElementById('tableBody');

masterData.forEach((item, index) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
        <td class="col-name">${item.name}</td>
        <td class="col-remain" id="remain-${index}">${item.stock}</td>
        <td><input type="number" value="0" oninput="calculate(${index}, ${item.stock})" onclick="this.select()"></td>
        <td><input type="number" value="0" oninput="calculate(${index}, ${item.stock})" onclick="this.select()"></td>
        <td><input type="number" value="0" oninput="calculate(${index}, ${item.stock})" onclick="this.select()"></td>
        <td><input type="number" value="0" oninput="calculate(${index}, ${item.stock})" onclick="this.select()"></td>
        <td><input type="number" value="0" oninput="calculate(${index}, ${item.stock})" onclick="this.select()"></td>
    `;
    tableBody.appendChild(tr);
});

function calculate(rowIndex, stock) {
    const row = document.querySelectorAll('#tableBody tr')[rowIndex];
    const inputs = row.querySelectorAll('input[type="number"]');
    const remainCell = document.getElementById(`remain-${rowIndex}`);

    let totalUsed = 0;
    inputs.forEach(input => {
        totalUsed += parseInt(input.value) || 0;
    });

    const currentRemain = stock - totalUsed;
    remainCell.innerText = currentRemain;

    if (currentRemain < 0) {
        remainCell.parentElement.style.backgroundColor = "#ffcccc"; // 行全体を警告色に
        remainCell.style.color = "#ff0000";
    } else {
        remainCell.parentElement.style.backgroundColor = "";
        remainCell.style.color = "#d32f2f";
    }
}
</script>

</body>
</html>
