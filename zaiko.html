<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>機材員数管理 (完全リセット版)</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; touch-action: manipulation; }
        html, body { margin: 0; padding: 0; width: 100%; background-color: #fff; }

        .share-container {
            padding: 10px; background: #f8f9fa; text-align: center;
            border-bottom: 1px solid #ddd; position: sticky; top: 0; z-index: 300;
        }
        .share-btn {
            padding: 12px 24px; background: #28a745; color: white; border: none;
            border-radius: 8px; font-weight: bold; font-size: 14px;
        }

        table { border-collapse: collapse; width: 100%; table-layout: fixed; }

        thead th {
            position: sticky; top: 60px; z-index: 250;
            background-color: #000; color: #fff; height: 160px;
            vertical-align: top; padding-top: 10px;
        }

        .header-wrap {
            display: flex; flex-direction: column; align-items: center; width: 100%;
        }

        .header-input {
            width: 30px; height: 100px; background: #333; color: #fff;
            border: 1px solid #777; font-size: 15px; font-weight: bold;
            text-align: center; outline: none; border-radius: 4px;
            writing-mode: vertical-rl; text-orientation: upright;
            display: block; margin-bottom: 8px;
            -webkit-appearance: none;
        }
        .header-input:focus { background: #555; border-color: #28a745; }

        .reset-btn {
            display: block; width: 32px; padding: 4px 0;
            font-size: 10px; background: #e74c3c; color: #fff; border: none; border-radius: 4px;
        }

        .w-name { width: 34%; }
        .w-remain { width: 12%; }
        .w-shoot { width: 10.8%; min-width: 40px; }

        td { padding: 0; text-align: center; border-bottom: 1px solid #ddd; }
        .col-name { font-size: 12px; font-weight: bold; padding-left: 6px; text-align: left !important; overflow: hidden; white-space: nowrap; }
        .col-remain { font-size: 18px; font-weight: 900; color: #d32f2f; background-color: #fffafa; }

        .input-cell {
            width: 100%; height: 60px; font-size: 18px; font-weight: bold;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .is-zero { color: #aaa; }
        .bg-guide { background-color: rgba(0,0,0,0.03); }
        .active-cell { background-color: #bbdefb !important; color: #000 !important; border: 2px solid #007bff; }

        #numpad {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: #444; padding: 15px; display: none;
            grid-template-columns: repeat(4, 1fr); gap: 10px;
            z-index: 1000; box-shadow: 0 -4px 15px rgba(0,0,0,0.4);
        }
        .num-btn {
            background: #fff; border: none; border-radius: 8px;
            height: 65px; font-size: 22px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 3px 0 #bbb;
        }
        .num-btn:active { background: #ddd; transform: translateY(2px); box-shadow: none; }
        
        .btn-10s { background: #ffd54f; } 
        .btn-clear { background: #ff8a65; color: #fff; } 
        .btn-close { background: #78909c; color: #fff; }

        .bottom-spacer { height: 400px; }
    </style>
</head>
<body>

<div class="share-container">
    <button class="share-btn" onclick="generateShareLink()">今の状態をLINEで共有する</button>
</div>

<table>
    <thead>
        <tr>
            <th class="w-name" style="vertical-align: middle;">機材名</th>
            <th class="w-remain" style="vertical-align: middle;">残</th>
            <script>
                for(let i=1; i<=5; i++){
                    document.write(`
                        <th class="w-shoot">
                            <div class="header-wrap">
                                <input type="text" class="header-input" value="撮影${i}" 
                                       data-default="撮影${i}"
                                       onfocus="headerFocus(this)" 
                                       onblur="headerBlur(this)">
                                <button class="reset-btn" onclick="resetColumn(${i-1})">C</button>
                            </div>
                        </th>
                    `);
                }
            </script>
        </tr>
    </thead>
    <tbody id="tableBody"></tbody>
</table>

<div class="bottom-spacer"></div>
<div id="numpad"></div>

let originalHeaderValue = "";

function headerFocus(el) {
    originalHeaderValue = el.value;
    el.value = "";
}

function headerBlur(el) {
    if (el.value.trim() === "") {
        el.value = originalHeaderValue;
    }
}

const palette = ["#e3f2fd", "#f1f8e9", "#fff3e0", "#f3e5f5", "#e0f2f1", "#fff9c4"];
const genreColors = {};
let colorIdx = 0;
let currentTarget = null;
let isFirstTap = true;

const tableBody = document.getElementById('tableBody');
const numpad = document.getElementById('numpad');

masterData.forEach((item, index) => {
    if (!genreColors[item.genre]) {
        genreColors[item.genre] = palette[colorIdx % palette.length];
        colorIdx++;
    }
    const tr = document.createElement('tr');
    tr.dataset.stock = item.stock;
    tr.innerHTML = `
        <td class="col-name" style="background-color:${genreColors[item.genre]}">${item.name}</td>
        <td class="col-remain" id="remain-${index}">${item.stock}</td>
        ${[0,1,2,3,4].map(c => `<td class="${c%2===0?'bg-guide':''}"><div class="input-cell is-zero" data-row="${index}" data-col="${c}" onclick="openNumpad(this)">0</div></td>`).join('')}
    `;
    tableBody.appendChild(tr);
});

function openNumpad(el) {
    if (currentTarget) currentTarget.classList.remove('active-cell');
    currentTarget = el;
    currentTarget.classList.add('active-cell');
    isFirstTap = true;

    const rect = el.getBoundingClientRect();
    const offset = window.pageYOffset + rect.top - (window.innerHeight / 3);
    window.scrollTo({ top: offset, behavior: 'smooth' });

    const stock = parseInt(masterData[el.dataset.row].stock);
    renderNumpad(stock);
    numpad.style.display = 'grid';
}

function renderNumpad(stock) {
    numpad.innerHTML = '';
    const finalizeAndClose = () => { numpad.style.display = 'none'; currentTarget.classList.remove('active-cell'); };

    if (stock <= 10) {
        for (let i = 1; i <= stock; i++) {
            addBtn(i, () => { currentTarget.innerText = i; finalizeInput(); });
        }
        while(numpad.children.length % 4 !== 2) addEmpty();
        addBtn("C", () => { currentTarget.innerText = 0; isFirstTap = true; finalizeInput(); }, "btn-clear");
        addBtn("決定", finalizeAndClose, "btn-close");
    } else {
        for (let i = 1; i <= 9; i++) {
            addBtn(i, () => appendNumber(i));
            if (i === 3) addBtn("+10", () => appendNumber(10), "btn-10s");
            if (i === 6) addEmpty();
            if (i === 9) addBtn("C", () => { currentTarget.innerText = 0; isFirstTap = true; finalizeInput(); }, "btn-clear");
        }
        addEmpty(); addEmpty(); addEmpty();
        addBtn("決定", finalizeAndClose, "btn-close");
    }
}

function addBtn(text, action, extraClass = "") {
    const btn = document.createElement('button');
    btn.className = `num-btn ${extraClass}`;
    btn.innerText = text;
    btn.onclick = action;
    numpad.appendChild(btn);
}

function addEmpty() {
    const div = document.createElement('div');
    numpad.appendChild(div);
}

function appendNumber(num) {
    let currentVal = parseInt(currentTarget.innerText) || 0;
    if (isFirstTap) { currentVal = num; isFirstTap = false; } 
    else { currentVal += num; }
    const stock = parseInt(masterData[currentTarget.dataset.row].stock);
    if (currentVal > stock) currentVal = stock;
    currentTarget.innerText = currentVal;
    finalizeInput();
}

function finalizeInput() {
    const val = parseInt(currentTarget.innerText);
    if (val > 0) currentTarget.classList.remove('is-zero');
    else currentTarget.classList.add('is-zero');
    calculateRow(currentTarget.dataset.row);
}

function calculateRow(rowIndex) {
    const row = document.querySelectorAll('#tableBody tr')[rowIndex];
    const cells = row.querySelectorAll('.input-cell');
    const remainCell = document.getElementById(`remain-${rowIndex}`);
    let totalUsed = 0;
    cells.forEach(cell => { totalUsed += parseInt(cell.innerText) || 0; });
    const currentRemain = parseInt(row.dataset.stock) - totalUsed;
    remainCell.innerText = currentRemain;
    remainCell.style.backgroundColor = currentRemain < 0 ? "#ff0000" : "#fffafa";
    remainCell.style.color = currentRemain < 0 ? "#ffffff" : "#d32f2f";
}

// 修正されたリセット機能
function resetColumn(colIndex) {
    if (!confirm(`この列（名前と員数）を初期状態にリセットしますか？`)) return;
    
    // 1. ヘッダー名の初期化
    const headerInputs = document.querySelectorAll('.header-input');
    const targetHeader = headerInputs[colIndex];
    targetHeader.value = targetHeader.getAttribute('data-default');
    
    // 2. 員数の初期化
    document.querySelectorAll('#tableBody tr').forEach((row, rowIndex) => {
        const cell = row.querySelectorAll('.input-cell')[colIndex];
        cell.innerText = 0; 
        cell.classList.add('is-zero');
        calculateRow(rowIndex);
    });
}

function generateShareLink() {
    const allValues = [];
    document.querySelectorAll('.input-cell').forEach(cell => allValues.push(cell.innerText));
    const headerInputs = document.querySelectorAll('.header-input');
    const headerNames = Array.from(headerInputs).map(i => encodeURIComponent(i.value));
    const shareUrl = `${window.location.href.split('?')[0]}?h=${headerNames.join(',')}&d=${allValues.join(',')}`;
    navigator.clipboard.writeText(shareUrl).then(() => alert("共有URLをコピーしました！")).catch(() => prompt("コピー：", shareUrl));
}

window.onload = function() {
    const params = new URLSearchParams(window.location.search);
    const d = params.get('d'), h = params.get('h');
    const headerInputs = document.querySelectorAll('.header-input');
    if (h) {
        const names = h.split(',');
        headerInputs.forEach((input, i) => { if(names[i]) input.value = decodeURIComponent(names[i]); });
    }
    if (d) {
        const vals = d.split(','), rows = document.querySelectorAll('#tableBody tr');
        let idx = 0;
        rows.forEach((row, rIdx) => {
            row.querySelectorAll('.input-cell').forEach(cell => {
                const v = vals[idx++] || 0;
                cell.innerText = v;
                if (v > 0) cell.classList.remove('is-zero');
            });
            calculateRow(rIdx);
        });
    }
};
