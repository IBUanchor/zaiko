<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>機材入力</title>
    <style>
        body { font-family: sans-serif; margin: 0; background-color: #fff; color: #000; }
        
        table { border-collapse: collapse; width: 100%; table-layout: fixed; }
        
        /* ヘッダー固定 */
        thead th {
            position: sticky; top: 0; z-index: 10;
            background-color: #000; color: #fff;
            font-size: 14px; padding: 12px 2px;
            border: none;
        }

        td { border-bottom: 1px solid #eee; padding: 8px 2px; text-align: center; vertical-align: middle; }

        /* 機材名：太字・黒 */
        .col-name { 
            color: #000; font-weight: bold; font-size: 17px; 
            text-align: left !important; padding-left: 10px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        /* 残り数量：強調 */
        .col-remain { font-size: 22px; font-weight: 900; color: #d32f2f; }

        /* 入力エリア：枠線なし、背景色で区別 */
        input[type="number"] {
            width: 90%;
            height: 45px;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            border: none;      /* 四角い枠を消去 */
            background-color: #f0f0f0; /* 薄いグレーで入力箇所を表現 */
            border-radius: 0;
            outline: none;     /* タップ時の青枠も消去 */
            -moz-appearance: textfield;
        }
        
        /* 入力中だけ少し色を濃くする（どこを触っているか分かるように） */
        input[type="number"]:focus {
            background-color: #e0e0e0;
        }

        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button {
            -webkit-appearance: none; margin: 0;
        }

        /* 列の幅調整 */
        .w-name   { width: 38%; } 
        .w-remain { width: 14%; } 
        .w-shoot  { width: 9.6%; } 

        /* 行の区切り */
        tr { border-bottom: 1px solid #ddd; }
    </style>
</head>
<body>

<table>
    <thead>
        <tr>
            <th class="w-name">機材名</th>
            <th class="w-remain">残</th>
            <th class="w-shoot">①</th>
            <th class="w-shoot">②</th>
            <th class="w-shoot">③</th>
            <th class="w-shoot">④</th>
            <th class="w-shoot">⑤</th>
        </tr>
    </thead>
    <tbody id="tableBody">
        </tbody>
</table>

<script>
const masterData = [
    { name: "Sony α7IV", stock: 10 },
    { name: "Sony α7sIII", stock: 5 },
    { name: "24-70mm GM", stock: 8 },
    { name: "70-200mm GM", stock: 4 },
    { name: "Sachtler 三脚", stock: 12 },
    { name: "600d Pro", stock: 6 },
    { name: "UWP-D21", stock: 10 }
];

const tableBody = document.getElementById('tableBody');

masterData.forEach((item, index) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
        <td class="col-name">${item.name}</td>
        <td class="col-remain" id="remain-${index}">${item.stock}</td>
        <td><input type="number" value="0" oninput="calculate(${index}, ${item.stock})" onclick="this.select()"></td>
        <td><input type="number" value="0" oninput="calculate(${index}, ${item.stock})" onclick="this.select()"></td>
        <td><input type="number" value="0" oninput="calculate(${index}, ${item.stock})" onclick="this.select()"></td>
        <td><input type="number" value="0" oninput="calculate(${index}, ${item.stock})" onclick="this.select()"></td>
        <td><input type="number" value="0" oninput="calculate(${index}, ${item.stock})" onclick="this.select()"></td>
    `;
    tableBody.appendChild(tr);
});

function calculate(rowIndex, stock) {
    const row = document.querySelectorAll('#tableBody tr')[rowIndex];
    const inputs = row.querySelectorAll('input[type="number"]');
    const remainCell = document.getElementById(`remain-${rowIndex}`);

    let totalUsed = 0;
    inputs.forEach(input => {
        totalUsed += parseInt(input.value) || 0;
    });

    const currentRemain = stock - totalUsed;
    remainCell.innerText = currentRemain;

    if (currentRemain < 0) {
        remainCell.parentElement.style.backgroundColor = "#ffcccc"; 
        remainCell.style.color = "#ff0000";
    } else {
        remainCell.parentElement.style.backgroundColor = "";
        remainCell.style.color = "#d32f2f";
    }
}
</script>

</body>
</html>
