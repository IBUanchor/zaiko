<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>機材管理</title>
    <style>
        body { font-family: sans-serif; margin: 0; background-color: #fff; }
        
        table { border-collapse: collapse; width: 100%; table-layout: fixed; }
        
        /* 1行目の高さを増やして見やすく */
        thead th {
            position: sticky; top: 0; z-index: 10;
            background-color: #000; color: #fff;
            padding: 10px 0; border: none;
            height: 120px; /* ヘッダーの高さをしっかり確保 */
            vertical-align: middle;
        }

        /* 確実に縦並びにするためのボックス */
        .v-text-box {
            display: inline-block;
            font-size: 14px;
            line-height: 1.2;
            font-weight: bold;
            text-align: center;
            width: 1em; /* 1文字分の幅に強制 */
            word-wrap: break-word; /* はみ出したら改行 */
        }

        .reset-btn {
            display: block;
            margin: 8px auto 0;
            padding: 4px 0;
            width: 80%;
            font-size: 11px;
            background: #e74c3c; /* 目立つ赤色に変更 */
            color: #fff;
            border: none;
            border-radius: 3px;
            font-weight: bold;
        }

        /* 列幅固定 */
        .w-name   { width: 34%; } 
        .w-remain { width: 11%; } 
        .w-shoot  { width: 11%; } 

        td { padding: 0; text-align: center; vertical-align: middle; border-bottom: 1px solid #ddd; }

        .col-name { 
            font-size: 10px; font-weight: bold; color: #333;
            text-align: left !important; padding-left: 6px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .col-remain { font-size: 18px; font-weight: 900; color: #d32f2f; background-color: #fffafa; }

        input[type="number"] {
            width: 100%; height: 60px; /* 入力しやすくさらに高く */
            font-size: 22px; font-weight: bold;
            text-align: center; border: none; background-color: transparent;
            outline: none; display: block; -moz-appearance: textfield;
        }

        .bg-guide { background-color: #f7f7f7; }
        input:focus { background-color: #e8f0fe !important; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body>

<table>
    <thead>
        <tr>
            <th class="w-name">機材名</th>
            <th class="w-remain">残</th>
            <th class="w-shoot"><span class="v-text-box">撮影１</span><button class="reset-btn" onclick="resetColumn(0)">C</button></th>
            <th class="w-shoot"><span class="v-text-box">撮影２</span><button class="reset-btn" onclick="resetColumn(1)">C</button></th>
            <th class="w-shoot"><span class="v-text-box">撮影３</span><button class="reset-btn" onclick="resetColumn(2)">C</button></th>
            <th class="w-shoot"><span class="v-text-box">撮影４</span><button class="reset-btn" onclick="resetColumn(3)">C</button></th>
            <th class="w-shoot"><span class="v-text-box">撮影５</span><button class="reset-btn" onclick="resetColumn(4)">C</button></th>
        </tr>
    </thead>
    <tbody id="tableBody">
        </tbody>
</table>

<script>
const masterData = [
    { name: "Sony α7IV", stock: 10 },
    { name: "Sony α7sIII", stock: 5 },
    { name: "FE 24-70mm GM II", stock: 8 },
    { name: "FE 70-200mm GM", stock: 4 },
    { name: "Sachtler Flowtech", stock: 12 },
    { name: "600d Pro", stock: 6 },
    { name: "UWP-D21", stock: 10 }
];

const tableBody = document.getElementById('tableBody');

masterData.forEach((item, index) => {
    const tr = document.createElement('tr');
    tr.dataset.stock = item.stock;
    tr.innerHTML = `
        <td class="col-name">${item.name}</td>
        <td class="col-remain" id="remain-${index}">${item.stock}</td>
        <td class="bg-guide"><input type="number" class="shoot-0" value="0" oninput="calculateRow(${index})" onclick="this.select()"></td>
        <td><input type="number" class="shoot-1" value="0" oninput="calculateRow(${index})" onclick="this.select()"></td>
        <td class="bg-guide"><input type="number" class="shoot-2" value="0" oninput="calculateRow(${index})" onclick="this.select()"></td>
        <td><input type="number" class="shoot-3" value="0" oninput="calculateRow(${index})" onclick="this.select()"></td>
        <td class="bg-guide"><input type="number" class="shoot-4" value="0" oninput="calculateRow(${index})" onclick="this.select()"></td>
    `;
    tableBody.appendChild(tr);
});

function calculateRow(rowIndex) {
    const row = document.querySelectorAll('#tableBody tr')[rowIndex];
    const inputs = row.querySelectorAll('input[type="number"]');
    const stock = parseInt(row.dataset.stock);
    const remainCell = document.getElementById(`remain-${rowIndex}`);

    let totalUsed = 0;
    inputs.forEach(input => {
        totalUsed += parseInt(input.value) || 0;
    });

    const currentRemain = stock - totalUsed;
    remainCell.innerText = currentRemain;

    if (currentRemain < 0) {
        remainCell.style.backgroundColor = "#ff0000"; 
        remainCell.style.color = "#ffffff";
    } else {
        remainCell.style.backgroundColor = "#fffafa";
        remainCell.style.color = "#d32f2f";
    }
}

function resetColumn(colIndex) {
    if(!confirm(`撮影${colIndex + 1}をリセットしますか？`)) return;
    const inputs = document.querySelectorAll(`.shoot-${colIndex}`);
    inputs.forEach((input, rowIndex) => {
        input.value = 0;
        calculateRow(rowIndex);
    });
}
</script>

</body>
</html>
